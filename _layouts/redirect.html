<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: 'Redirecting' | escape }}</title>
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
  </head>
  <body>
    <p><a href="{{ page.redirect_to | relative_url }}">{{ page.title | default: 'Continue' | escape }}</a></p>
    <script>location.replace({{ page.redirect_to | relative_url | jsonify }});</script>
  </body>
</html>
