alt_zh: 系统与算法协同设计，通过云边端协作推动边缘智能规模化落地，服务人、城市、产业与社会
alt_en: System–algorithm co-design and device–edge–cloud collaboration bring Edge AI to real-world applications for people, cities, industries, and society
