backend:
  name: github
  repo: EdgeAI-2000/EdgeAI-2000.github.io
  branch: main
  client_id: Ov23liOT1xM6d06Bbtqy
  base_url: https://eais-cms-oauth.neardws.workers.dev
  auth_endpoint: /oauth
  # OAuth 代理由 Cloudflare Worker eais-cms-oauth 处理
  # Worker 地址：https://eais-cms-oauth.neardws.workers.dev
  # 仅向管理员授予仓库写权限；组织成员身份本身不授予编辑权限。

# 上传的图片存放位置
media_folder: "assets/images/people"
public_folder: "/assets/images/people"

# 站点预览地址
site_url: https://eaislab.com
display_url: https://eaislab.com
logo_url: https://eaislab.com/assets/images/placeholders/avatar.svg

# 本地化
publish_mode: editorial_workflow
locale: zh_Hans

media_library:
  name: cloudflare_images
  config:
    # 部署 workers/images 后填写 HTTPS 地址，不要填写密钥。
    endpoint: ""

collections:
  # ── 成员信息（管理员维护） ──────────────────────────────
  - name: "people"
    label: "成员 / People"
    label_singular: "成员"
    folder: "_people"
    create: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}} · {{role}} · {{status}}"
    fields:
      - { label: "姓名", name: "name", widget: "string", hint: "中文全名" }
      - label: "角色"
        name: "role"
        widget: "select"
        options:
          - { label: "PI / 导师", value: "pi" }
          - { label: "博士研究生", value: "phd" }
          - { label: "硕士研究生", value: "master" }
          - { label: "本科生", value: "undergrad" }
          - { label: "博士后", value: "postdoc" }
          - { label: "工程师", value: "engineer" }
          - { label: "研究助理", value: "ra" }
      - label: "状态"
        name: "status"
        widget: "select"
        default: "current"
        options:
          - { label: "在读 / 在职", value: "current" }
          - { label: "校友", value: "alumni" }
      - label: "头像"
        name: "avatar"
        widget: "image"
        required: false
        hint: "上传后选择头像尺寸，自动通过 Cloudflare 优化分发"
        default: "/assets/images/placeholders/avatar.svg"
        media_library:
          config:
            multiple: false
      - { label: "中文简介", name: "bio_zh", widget: "text", required: false, hint: "60-120 字，介绍研究方向与背景" }
      - { label: "English Bio", name: "bio_en", widget: "text", required: false }
      - label: "研究方向标签"
        name: "research_areas"
        widget: "list"
        required: false
        hint: "每行一个标签，如：协同感知、模型压缩"
        field: { label: "方向", name: "area", widget: "string" }
      - { label: "邮箱", name: "email", widget: "string", required: false, pattern: ['^[^@]+@[^@]+\.[^@]+$', "请输入有效邮箱"] }
      - { label: "个人主页", name: "homepage", widget: "string", required: false }
      - { label: "Google Scholar", name: "scholar", widget: "string", required: false }
      - { label: "GitHub", name: "github", widget: "string", required: false }
      - { label: "DBLP", name: "dblp", widget: "string", required: false }
      - { label: "学院 / 单位", name: "affiliation", widget: "string", required: false }
      - { label: "在读时间", name: "period", widget: "string", required: false, hint: "如：2024 – 至今" }
      - { label: "毕业去向", name: "destination", widget: "string", required: false, hint: "仅校友填写" }
      - { label: "详细介绍（可选）", name: "body", widget: "markdown", required: false }

  # ── 新闻（导师/管理员发布） ────────────────────────────────
  - name: "news"
    label: "新闻动态 / News"
    label_singular: "新闻"
    folder: "_news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    filter: { field: "lang", value: "zh" }
    fields:
      - { label: "标题（中文）", name: "title", widget: "string" }
      - { label: "Title (English)", name: "title_en", widget: "string", required: false }
      - { label: "语言", name: "lang", widget: "hidden", default: "zh" }
      - { label: "日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - label: "类型"
        name: "type"
        widget: "select"
        default: "news"
        options:
          - { label: "新闻", value: "news" }
          - { label: "获奖", value: "award" }
          - { label: "媒体报道", value: "press" }
      - { label: "摘要（中文）", name: "summary", widget: "text", hint: "显示在新闻列表页，建议 80 字以内" }
      - { label: "Summary (English)", name: "summary_en", widget: "text", required: false }
      - label: "封面图"
        name: "cover"
        widget: "image"
        required: false
        default: "/assets/images/placeholders/card-16x9.svg"
      - label: "相关作者"
        name: "authors"
        widget: "list"
        required: false
        field: { label: "姓名", name: "name", widget: "string" }
      - { label: "会议/期刊", name: "venue", widget: "string", required: false }
      - { label: "链接", name: "link", widget: "string", required: false }
      - { label: "正文", name: "body", widget: "markdown", required: false }


  - name: "projects"
    label: "项目 / Projects"
    folder: "_projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "英文标题", name: "title_en", widget: "string", required: false }
      - { label: "日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false }
      - { label: "状态", name: "status", widget: "select", options: [active, completed], default: active }
      - { label: "中文摘要", name: "summary_zh", widget: "text" }
      - { label: "英文摘要", name: "summary_en", widget: "text", required: false }
      - { label: "封面", name: "cover", widget: "image", required: false }
      - { label: "研究方向", name: "themes", widget: "list", required: false }
      - { label: "亮点", name: "highlights", widget: "list", required: false }
      - { label: "代码链接", name: "code", widget: "string", required: false }
      - { label: "论文链接", name: "pdf", widget: "string", required: false }
      - { label: "演示视频", name: "demo_video", widget: "string", required: false }
      - { label: "正文", name: "body", widget: "markdown", required: false }

  - name: "publications"
    label: "手工论文 / Publications"
    description: "此处维护的论文不会被 Scholar 自动同步覆盖；请先检查是否已有同名论文。"
    folder: "_publications/manual"
    create: true
    slug: "{{fields.year}}-{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "作者", name: "authors", widget: "list" }
      - { label: "年份", name: "year", widget: "number", value_type: "int", min: 1900 }
      - { label: "会议 / 期刊", name: "venue", widget: "string" }
      - { label: "类型", name: "type", widget: "select", options: [conference, journal, preprint] }
      - { label: "CCF 等级", name: "ccf", widget: "string", required: false }
      - { label: "PDF", name: "pdf", widget: "string", required: false }
      - { label: "代码", name: "code", widget: "string", required: false }
      - { label: "来源", name: "source", widget: "hidden", default: manual }
      - { label: "正文", name: "body", widget: "markdown", required: false }

  - name: "patents"
    label: "专利 / Patents"
    folder: "_patents"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "名称", name: "title", widget: "string" }
      - { label: "年份", name: "year", widget: "number", value_type: "int", min: 1900 }
      - { label: "发明人", name: "inventors", widget: "list" }
      - { label: "申请人", name: "assignee", widget: "string" }
      - { label: "申请号", name: "application_no", widget: "string", required: false }
      - { label: "授权 / 公开号", name: "number", widget: "string", required: false }
      - { label: "状态", name: "status", widget: "select", options: [pending, granted], default: pending }
      - { label: "正文", name: "body", widget: "markdown", required: false }
