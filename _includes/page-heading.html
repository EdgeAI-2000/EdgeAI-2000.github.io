<div class="page-heading">
  <h1>{{ include.title | default: page.title }}</h1>
  {% if page.mascot == 'badge' %}
    <img class="page-badge" src="{{ site.data.brand.badge }}" width="1230" height="1278" alt="" aria-hidden="true" />
  {% elsif page.mascot %}
    {% include mascot.html pose=page.mascot %}
  {% endif %}
</div>
