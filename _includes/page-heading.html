<div class="page-heading">
  <h1>{{ include.title | default: page.title }}</h1>
  {% if page.mascot == 'badge' %}
    {% include img.html src=site.data.brand.badge class="page-badge" width="1230" height="1278" alt="" hidden=true priority="eager" %}
  {% elsif page.mascot %}
    {% include mascot.html pose=page.mascot %}
  {% endif %}
</div>
